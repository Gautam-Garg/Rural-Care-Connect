<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rural Care Connect</title>
  <meta name="description" content="Rural Care Connect - Healthcare access for every village. Decentralized Primary Health Centre (PHC), ASHA worker, and citizen health portal.">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <div class="login-card">
          <!-- Header Banner -->
          <div class="login-header-banner" style="background: linear-gradient(135deg, #0d9488 0%, #047857 100%);">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="login-icon-badge" style="background: rgba(255,255,255,0.25);">
                <i class="bi bi-heart-pulse-fill text-white"></i>
              </div>
              <!-- Language Switcher in Login Card -->
              <select class="form-select form-select-sm bg-white text-dark w-auto border-0 fw-semibold" id="lang-select" style="font-size: 0.78rem;">
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="mr">मराठी (Marathi)</option>
              </select>
            </div>
            
            <h2 class="h4 text-white mb-1" data-i18n="appName">Rural Care Connect</h2>
            <p class="text-white-50 small mb-0" data-i18n="appTagline">Healthcare access for every village.</p>
          </div>

          <!-- Card Body -->
          <div class="p-4 p-md-4">
            
            <!-- Alert message placeholder -->
            <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

            <form id="login-form">
              <!-- Username -->
              <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Username / उपयोगकर्ता</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0">
                    <i class="bi bi-person"></i>
                  </span>
                  <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Enter username" required autofocus autocomplete="username">
                </div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">Password / पासवर्ड</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                  <button class="btn btn-outline-light border text-muted" type="button" id="toggle-password" title="Toggle password visibility">
                    <i class="bi bi-eye" id="toggle-icon"></i>
                  </button>
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm mb-3" id="btn-submit" style="background-color: #0d9488; border-color: #0d9488;">
                <span id="btn-text">Sign In / प्रवेश करें</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-1" role="status" aria-hidden="true"></span>
              </button>
            </form>

            <!-- Quick Demo Credentials for Viva / Testing -->
            <div class="border-top pt-3 mt-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small fw-semibold" style="font-size: 0.78rem;">ONE-CLICK DEMO LOGINS</span>
                <span class="badge bg-light text-secondary border font-monospace" style="font-size: 0.7rem;">Click to fill</span>
              </div>

              <div class="row g-2">
                <div class="col-4">
                  <div class="demo-account-chip text-center p-2 border rounded cursor-pointer" onclick="fillCredentials('admin', 'admin123')">
                    <div class="fw-bold text-danger small"><i class="bi bi-shield-lock me-1"></i>Admin</div>
                    <div class="text-muted font-monospace" style="font-size: 0.68rem;">admin123</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="demo-account-chip text-center p-2 border rounded cursor-pointer" onclick="fillCredentials('asha', 'asha123')">
                    <div class="fw-bold text-warning small" style="color: #d97706 !important;"><i class="bi bi-person-heart me-1"></i>ASHA</div>
                    <div class="text-muted font-monospace" style="font-size: 0.68rem;">asha123</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="demo-account-chip text-center p-2 border rounded cursor-pointer" onclick="fillCredentials('viewer', 'viewer123')">
                    <div class="fw-bold text-success small"><i class="bi bi-eye me-1"></i>Citizen</div>
                    <div class="text-muted font-monospace" style="font-size: 0.68rem;">viewer123</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Emergency 108 Call Link -->
            <div class="mt-3 text-center">
              <a href="tel:108" class="btn btn-sm btn-outline-danger w-100 fw-bold">
                <i class="bi bi-telephone-fill me-1"></i> Emergency Ambulance: Call 108
              </a>
            </div>

            <!-- DBMS Course Footer -->
            <div class="text-center mt-3 pt-2">
              <small class="text-muted" style="font-size: 0.75rem;">
                <i class="bi bi-database me-1"></i>Rural Care Connect • MySQL 8 + Node.js
              </small>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Shared API Client & i18n -->
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>

  <script>
    // Toggle Password Visibility
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    // Quick Fill Helper
    function fillCredentials(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      document.getElementById('login-alert').classList.add('d-none');
    }

    // Login Form Submission
    const form = document.getElementById('login-form');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertBox = document.getElementById('login-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) return;

      // Loading State
      btnSubmit.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('d-none');
      alertBox.classList.add('d-none');

      try {
        const response = await API.login(username, password);

        if (response.success) {
          // Role-based routing
          if (response.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else if (response.role === 'asha') {
            window.location.href = '/asha/dashboard.html';
          } else {
            window.location.href = '/public/dashboard.html';
          }
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid username or password';
        alertBox.classList.remove('d-none');
        btnSubmit.disabled = false;
        btnText.textContent = 'Sign In / प्रवेश करें';
        btnSpinner.classList.add('d-none');
      }
    });

    // Check if already authenticated on initial page load
    (async () => {
      try {
        const me = await API.getMe();
        if (me.authenticated) {
          if (me.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else if (me.role === 'asha') {
            window.location.href = '/asha/dashboard.html';
          } else {
            window.location.href = '/public/dashboard.html';
          }
        }
      } catch (e) {
        // Not authenticated, stay on login page
      }
    })();
  </script>
</body>
</html>
